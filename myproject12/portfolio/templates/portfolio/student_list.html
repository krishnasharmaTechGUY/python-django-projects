<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>My portfolio</title>
</head>
<body>
    <h1> Student data</h1>
    {% if students %}
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>City</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.age }}</td>
                <td>{{ student.city }}</td>
            </tr>
            {% endfor %}

        </tbody>
    </table>
    {% else %}
    <p>No student data available</p>
    {% endif %}
</body>
</html>
